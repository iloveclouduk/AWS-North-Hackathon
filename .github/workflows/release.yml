name: release
# Tag v1.2.3 → a production extension zip on the GitHub release, ready to upload to the Chrome Web Store.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run check
      - name: Build against the hosted backend
        run: npm run zip
        env:
          WXT_BACKEND: hosted
          WXT_AWS_WS_URL: ${{ vars.WXT_AWS_WS_URL }}
          WXT_AWS_API_URL: ${{ vars.WXT_AWS_API_URL }}
          WXT_COGNITO_DOMAIN: ${{ vars.WXT_COGNITO_DOMAIN }}
          WXT_COGNITO_CLIENT_ID: ${{ vars.WXT_COGNITO_CLIENT_ID }}
      - uses: softprops/action-gh-release@v2
        with: { files: .output/*-chrome.zip }
