name: release
# Tag v1.2.3 → production extension zips on the GitHub release: Chrome Web Store (also Edge Add-ons) and
# Firefox Add-ons (with the sources zip AMO asks for). Safari ships through Xcode (docs/safari.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run check
      - name: Build against the hosted backend
        run: npm run zip && npm run zip:firefox
        env:
          WXT_BACKEND: hosted
          WXT_STORE_BUILD: 'true'
          WXT_AWS_WS_URL: ${{ vars.WXT_AWS_WS_URL }}
          WXT_AWS_API_URL: ${{ vars.WXT_AWS_API_URL }}
          WXT_COGNITO_DOMAIN: ${{ vars.WXT_COGNITO_DOMAIN }}
          WXT_COGNITO_CLIENT_ID: ${{ vars.WXT_COGNITO_CLIENT_ID }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
