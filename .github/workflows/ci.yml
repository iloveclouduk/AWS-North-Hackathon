name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Smoke (city + Console Copilot flows)
        run: |
          npm run build
          xvfb-run -a node scripts/smoke.mjs
          xvfb-run -a node scripts/smoke-copilot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshots, path: .output/smoke, retention-days: 7 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit && npm test && npm run build:bundle
        working-directory: server
      - name: Docker image builds (arm64, not pushed)
        uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - run: docker buildx build --platform linux/arm64 -f server/Dockerfile .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
        working-directory: infra
      - run: npx tsc --noEmit && npm test
        working-directory: infra
      - name: cdk synth (cdk-nag AwsSolutions must pass)
        run: npx cdk synth -q -c env=staging && npx cdk synth -q -c env=prod
        working-directory: infra
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: cfn-lint the player role players install
        # Lint it as published (infra/lib/data-stack.ts substitutes our account id).
        run: |
          pip install cfn-lint
          sed -e 's/__AWS_CITY_ACCOUNT_ID__/123456789012/g' -e 's/__AWS_CITY_TASK_ROLE__/AWSCityTaskRole-prod/g' -e 's/__AWS_CITY_PLAYER_ROLE__/AWSCityPlayerRole/g' infra/player-role/player-role.yaml > "$RUNNER_TEMP/player-role.yaml"
          cfn-lint "$RUNNER_TEMP/player-role.yaml"
