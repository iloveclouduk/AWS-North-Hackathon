<title>Agentic City</title>
<style>
  :root {
    --bg: #140d1f;
    --panel: #241a37;
    --panel-2: #2d2144;
    --panel-border: #4a3768;
    --accent: #ffb84d;
    --accent-ink: #4a2e07;
    --text: #f5efe6;
    --muted: #b6a7d9;
    --shadow: rgba(8, 4, 16, 0.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, #2a1f42 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #201636 0%, transparent 50%);
    color: var(--text);
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  .stage { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 14px; }
  .window {
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 14px;
    box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 2px solid var(--panel-border);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.r { background: #ff6b6b; } .dot.y { background: #ffd166; } .dot.g { background: #6fe3a3; }
  .titlebar h1 {
    font-family: "Press Start 2P", "Nunito", sans-serif;
    font-size: 11px; letter-spacing: 0.5px; margin: 0 auto 0 8px;
    color: var(--text); text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .headcount {
    font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--panel-border);
  }
  .navbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
  }
  .navbar button {
    font-family: inherit; font-size: 11px;
    background: rgba(255,184,77,0.15); color: var(--accent);
    border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .navbar button[hidden] { display: none; }
  .room-wrap {
    padding: 10px; display: flex; justify-content: center;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 8px);
    position: relative;
  }
  #room, #interior {
    width: 100%; max-width: 600px;
    background: #0d0816;
    border-radius: 8px;
    border: 3px solid var(--panel-border);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.3), 0 8px 18px var(--shadow);
    cursor: pointer;
    image-rendering: pixelated;
  }
  #room { aspect-ratio: 560 / 340; }
  #interior { aspect-ratio: 460 / 300; }
  #interior[hidden], #room[hidden] { display: none; }
  .hud {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 14px 16px;
    border-top: 2px solid var(--panel-border);
    background: var(--panel-2);
  }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .log {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 132px; overflow-y: auto;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .log-row {
    display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px;
    background: rgba(0,0,0,0.22); align-items: baseline;
  }
  .log-row .agent { color: var(--accent); font-weight: 700; flex-shrink: 0; }
  .log-row .action { color: var(--text); }
  .log-row .time { margin-left: auto; color: var(--muted); font-size: 10.5px; flex-shrink: 0; }
  .credit { font-size: 10px; color: var(--muted); opacity: 0.7; }
  @media (max-width: 420px) { .titlebar h1 { font-size: 9px; } }
</style>

<div class="stage">
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <h1>Agentic City</h1>
      <span class="headcount">3 agents</span>
    </div>
    <div class="navbar">
      <button id="backBtn" type="button" hidden>&larr; Back to city</button>
      <span id="navLabel">Click a building to look inside.</span>
    </div>
    <div class="room-wrap">
      <canvas id="room" width="560" height="340" aria-label="An isometric pixel settlement with three buildings: Lambda, DynamoDB and CloudWatch, patrolled by agents"></canvas>
      <canvas id="interior" width="460" height="300" hidden aria-label="Interior view of the selected building"></canvas>
    </div>
    <div class="hud">
      <div class="legend">
        <span><i class="swatch" style="background:#ffb84d"></i>Lambda Yard</span>
        <span><i class="swatch" style="background:#6fe3a3"></i>DynamoDB Vault</span>
        <span><i class="swatch" style="background:#5aa7e0"></i>CloudWatch Watch</span>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <div class="credit">City &amp; character art: pixel-character pack</div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const HALF_W = CITY.tile.width / 2, HALF_H = CITY.tile.height / 2;

  // ---- a faithful port of the pack's own Python Scene compositor ----
  class SceneBuilder {
    constructor(originX, originY) {
      this.originX = originX; this.originY = originY; this.items = [];
    }
    vertex(tx, ty) {
      return { x: this.originX + (tx - ty) * HALF_W, y: this.originY + (tx + ty) * HALF_H };
    }
    push(img, sx, sy, sw, sh, anchor, tx, ty, depth, filter, meta) {
      const v = this.vertex(tx, ty);
      this.items.push({ img, sx, sy, sw, sh, dx: v.x - anchor[0], dy: v.y - anchor[1], depth, filter, meta });
    }
    floor(rec, tx, ty) {
      if (!rec) return console.warn("missing floor asset");
      this.push(rec.img, 0, 0, rec.img.width, rec.img.height, rec.anchor, tx, ty, -1000);
    }
    wall(rec, tx, ty, filter) {
      if (!rec) return console.warn("missing wall asset");
      this.push(rec.img, 0, 0, rec.img.width, rec.img.height, rec.anchor, tx, ty, -500, filter);
    }
    obj(rec, tx, ty, filter, info) {
      if (!rec) return console.warn("missing object asset at", tx, ty);
      const fp = rec.footprint || [1, 1];
      this.push(rec.img, 0, 0, rec.img.width, rec.img.height, rec.anchor, tx, ty, tx + ty + fp[0] + fp[1] - 2, filter, info ? { clickable: true, info } : undefined);
    }
    objFrame(rec, frameIndex, tx, ty, filter) {
      const fp = rec.footprint || [1, 1];
      const fw = rec.img.width / rec.frames;
      this.push(rec.img, frameIndex * fw, 0, fw, rec.img.height, rec.anchor, tx, ty, tx + ty + fp[0] + fp[1] - 2, filter);
    }
    char(sheet, sx, sy, tx, ty, sit, meta) {
      const v = this.vertex(tx, ty);
      this.items.push({
        img: sheet.img, sx, sy, sw: sheet.frameW, sh: sheet.frameH,
        dx: v.x - sheet.pivot[0], dy: v.y + 8 - sheet.pivot[1] - (sit ? 2 : 0),
        depth: tx + ty + 0.5, meta,
      });
    }
    render(ctx) {
      this.items.sort((a, b) => a.depth - b.depth);
      for (const it of this.items) {
        ctx.save();
        if (it.filter) ctx.filter = it.filter;
        ctx.drawImage(it.img, it.sx, it.sy, it.sw, it.sh, Math.round(it.dx), Math.round(it.dy), it.sw, it.sh);
        ctx.restore();
        if (it.meta && it.meta.label) drawFloatingLabel(ctx, it);
      }
    }
  }

  function drawFloatingLabel(ctx, it) {
    const cx = it.dx + it.sw / 2;
    const topY = it.dy - 4;
    ctx.font = it.meta.font || "6px sans-serif";
    ctx.textAlign = "center";
    const w = ctx.measureText(it.meta.label).width + 6;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(cx - w / 2, topY - 8, w, 8);
    ctx.fillStyle = it.meta.color || "#ffe6a8";
    ctx.fillText(it.meta.label, cx, topY - 2);
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A speech-bubble tooltip anchored above (cx, topY) in scene space.
  function drawBubble(ctx, cx, topY, text, maxWidth) {
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    const lineH = 13;
    const w = Math.min(maxWidth, Math.max(...lines.map((l) => ctx.measureText(l).width))) + 16;
    const h = lines.length * lineH + 10;
    const bx = cx - w / 2;
    const by = topY - h - 8;
    ctx.fillStyle = "#fff8ec";
    ctx.strokeStyle = "#4a2e07";
    ctx.lineWidth = 1.5;
    roundRectPath(ctx, bx, by, w, h, 6);
    ctx.fill();
    ctx.stroke();
    // tail
    ctx.beginPath();
    ctx.moveTo(cx - 5, by + h);
    ctx.lineTo(cx + 5, by + h);
    ctx.lineTo(cx, by + h + 7);
    ctx.closePath();
    ctx.fillStyle = "#fff8ec";
    ctx.fill();
    ctx.fillStyle = "#241a37";
    lines.forEach((l, i) => ctx.fillText(l, cx, by + 15 + i * lineH));
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function hydrate(dict) {
    const out = {};
    for (const [key, rec] of Object.entries(dict)) {
      out[key] = { ...rec, img: await loadImage(rec.data) };
    }
    return out;
  }

  const cityCanvas = document.getElementById("room");
  const cityCtx = cityCanvas.getContext("2d");
  const interiorCanvas = document.getElementById("interior");
  const interiorCtx = interiorCanvas.getContext("2d");
  const backBtn = document.getElementById("backBtn");
  const navLabel = document.getElementById("navLabel");
  cityCtx.imageSmoothingEnabled = false;
  interiorCtx.imageSmoothingEnabled = false;

  // ---- exterior grid ----
  const GRID_NX = 17, GRID_NY = 11;
  const ORIGIN_X = 288, ORIGIN_Y = 62;
  const PLAZA = { x0: 1, x1: 15, y0: 1, y1: 9 };

  const ZONES = [
    { key: "lambda", name: "Lambda Yard", hue: 0, buildTx: 1, buildTy: 1,
      actions: ["lambda:ListFunctions ✓", "Invoke healthcheck ✓"],
      talk: ["Watching invocations tick up...", "Cold start looks fine.", "Just tailing the logs.", "Redeploying the healthcheck."] },
    { key: "dynamodb", name: "DynamoDB Vault", hue: 130, buildTx: 7, buildTy: 1,
      actions: ["dynamodb:ListTables ✓", "dynamodb:DescribeTable ✓"],
      talk: ["Checking table throughput.", "Backups look current.", "Scanning for hot partitions.", "Replication's healthy."] },
    { key: "cloudwatch", name: "CloudWatch Watch", hue: 210, buildTx: 13, buildTy: 1,
      actions: ["cloudwatch:GetMetricData ✓", "Check alarm state ✓"],
      talk: ["No alarms firing right now.", "Watching the dashboards.", "Metrics look steady.", "Just set up a new widget."] },
  ];
  function doorPoint(zone) { return { x: zone.buildTx + 1, y: zone.buildTy + 2.4 }; }
  function hueFilter(hue) { return hue ? `hue-rotate(${hue}deg) saturate(1.15)` : "none"; }

  function randBetween(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(randBetween(a, b + 1)); }
  function plazaPoint(zone) {
    return {
      x: randBetween(Math.max(PLAZA.x0 + 0.5, zone.buildTx - 0.5), Math.min(PLAZA.x1 - 0.5, zone.buildTx + 3.5)),
      y: randBetween(zone.buildTy + 2.8, PLAZA.y1 - 0.5),
    };
  }

  const logEl = document.getElementById("log");
  const logEntries = [];
  function pushLog(agent, text) {
    logEntries.unshift({ agent: agent.label, text, t: new Date() });
    logEntries.length = Math.min(logEntries.length, 8);
    logEl.innerHTML = logEntries.map((e) => `
      <div class="log-row">
        <span class="agent">${e.agent}</span>
        <span class="action">${e.text}</span>
        <span class="time">${e.t.toLocaleTimeString([], { hour12: false })}</span>
      </div>
    `).join("");
  }

  const DIRS = ["SE", "SW", "NE", "NW"];
  // Hysteresis: only switch facing when the new axis clearly dominates, so a
  // near-diagonal path (|dx|~|dy|) doesn't flicker between two directions.
  function isoDirection(dx, dy, prevDir) {
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 0.03) return prevDir || "SE"; // negligible motion, keep facing
    const margin = 1.25;
    const xDominant = adx > ady * margin;
    const yDominant = ady > adx * margin;
    if (xDominant) return dx >= 0 ? "SE" : "NW";
    if (yDominant) return dy >= 0 ? "SW" : "NE";
    return prevDir || (adx >= ady ? (dx >= 0 ? "SE" : "NW") : (dy >= 0 ? "SW" : "NE"));
  }

  function makeAgent(label, zoneIndex) {
    const zone = ZONES[zoneIndex];
    const door = doorPoint(zone);
    return {
      label, zoneIndex, x: door.x, y: door.y,
      queue: [], phase: "working",
      workUntil: performance.now() + randBetween(800, 2600),
      currentAction: zone.actions[0],
      dir: "SE", moving: false, animTime: 0,
      speed: randBetween(1.4, 1.8), _leaving: false,
    };
  }
  function queueTripTo(agent, targetZoneIndex) {
    const target = ZONES[targetZoneIndex];
    const door = doorPoint(target);
    const stop = plazaPoint(target);
    agent.queue = [
      { x: agent.x, y: PLAZA.y1 - 0.6 },
      { x: door.x, y: PLAZA.y1 - 0.6 },
      { x: stop.x, y: stop.y },
      { x: door.x, y: door.y },
    ];
    agent.zoneIndex = targetZoneIndex;
    agent.phase = "commuting";
  }
  function leaveBuilding(agent) {
    const door = doorPoint(ZONES[agent.zoneIndex]);
    agent.phase = "commuting";
    agent.queue = [{ x: door.x, y: PLAZA.y1 - 0.6 }];
    agent._leaving = true;
  }
  function onArrive(agent, now) {
    if (agent._leaving) {
      agent._leaving = false;
      let next = randInt(0, ZONES.length - 1);
      if (next === agent.zoneIndex) next = (next + 1) % ZONES.length;
      queueTripTo(agent, next);
      return;
    }
    agent.phase = "working";
    agent.workUntil = now + randBetween(8000, 13000);
    const zone = ZONES[agent.zoneIndex];
    agent.currentAction = zone.actions[randInt(0, zone.actions.length - 1)];
    pushLog(agent, agent.currentAction.replace(" ✓", "") + " succeeded");
  }

  const agents = [
    makeAgent("Agent-λ", 0),
    makeAgent("Agent-DDB", 1),
    makeAgent("Agent-CW", 2),
  ];
  agents.forEach((a, i) => { a.workUntil = performance.now() + 900 + i * 1400; });

  function stepAgent(agent, dt, now) {
    if (agent.queue.length) {
      const wp = agent.queue[0];
      const dx = wp.x - agent.x, dy = wp.y - agent.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.05) {
        agent.queue.shift();
        agent.moving = agent.queue.length > 0;
        if (!agent.queue.length) onArrive(agent, now);
      } else {
        const step = Math.min(dist, agent.speed * dt);
        agent.x += (dx / dist) * step;
        agent.y += (dy / dist) * step;
        agent.dir = isoDirection(dx, dy, agent.dir);
        agent.moving = true;
      }
    } else if (agent.phase === "working" && now >= agent.workUntil) {
      leaveBuilding(agent);
    } else {
      agent.moving = false;
    }
    agent.animTime += dt;
  }

  const FRAME_TIME = 0.14;
  function charFrame(sheet, anim, dir, moving, animTime) {
    const rowIndex = { idle: 0, walk: 4, talk: 8, sit: 12 }[anim] + DIRS.indexOf(dir);
    const idleRow = 0 + DIRS.indexOf(dir);
    const counts = sheet.frameCounts;
    const count = moving ? counts[rowIndex] : counts[idleRow];
    const useRow = moving ? rowIndex : idleRow;
    const idx = Math.floor(animTime / (moving ? FRAME_TIME : FRAME_TIME * 2)) % count;
    return { sx: idx * sheet.frameW, sy: useRow * sheet.frameH };
  }

  // ---- exterior ----
  function buildingRect(zone, images) {
    const rec = images.buildings.data_center;
    const sceneOrigin = { x: ORIGIN_X, y: ORIGIN_Y };
    const v = { x: sceneOrigin.x + (zone.buildTx - zone.buildTy) * HALF_W, y: sceneOrigin.y + (zone.buildTx + zone.buildTy) * HALF_H };
    return { x0: v.x - rec.anchor[0], y0: v.y - rec.anchor[1], x1: v.x - rec.anchor[0] + rec.img.width, y1: v.y - rec.anchor[1] + rec.img.height };
  }

  function buildCityScene(images) {
    const s = new SceneBuilder(ORIGIN_X, ORIGIN_Y);
    for (let ty = 0; ty < GRID_NY; ty++) {
      for (let tx = 0; tx < GRID_NX; tx++) {
        const inPlaza = tx >= PLAZA.x0 && tx <= PLAZA.x1 && ty >= PLAZA.y0 && ty <= PLAZA.y1;
        s.floor(images.floors[inPlaza ? "sidewalk" : "grass"], tx, ty);
      }
    }
    // decorative dressing in the fogged border
    // scattered park/street dressing so the plaza reads as a populated city, not a bare strip
    s.obj(images.objects.tree, -0.4, 0.5);
    s.obj(images.objects.tree, 16.4, 9.5);
    s.obj(images.objects.tree, -0.4, 8.5);
    s.obj(images.objects.tree, 16.4, 1.5);
    s.obj(images.objects.lamp_post, 0.3, 5);
    s.obj(images.objects.lamp_post, 8, 8.5);
    s.obj(images.objects.lamp_post, 15.7, 5);
    s.obj(images.objects.bench_SE, 4, 6.5);
    s.obj(images.objects.bench_SW, 11.5, 6.5);
    s.obj(images.objects.bench_SE, 8, 4);
    s.obj(images.objects.plant, 2.5, 8.8);
    s.obj(images.objects.plant, 13.5, 8.8);

    const nowMs = performance.now();
    const blinkFrame = Math.floor(nowMs / 550) % images.buildings.data_center_strip.frames;
    for (const zone of ZONES) {
      s.objFrame(images.buildings.data_center_strip, blinkFrame, zone.buildTx, zone.buildTy, hueFilter(zone.hue));
    }
    s.obj(images.objects.lambda_sign_SE, ZONES[0].buildTx + 1, ZONES[0].buildTy + 2.2);

    const insideCounts = ZONES.map((_, i) => agents.filter((a) => a.phase === "working" && a.zoneIndex === i).length);
    const dcRec = images.buildings.data_center;
    ZONES.forEach((zone, i) => {
      const label = insideCounts[i] ? `${zone.name} · ${insideCounts[i]} inside` : zone.name;
      const v = s.vertex(zone.buildTx, zone.buildTy);
      const topY = v.y - dcRec.anchor[1];
      const centerX = v.x - dcRec.anchor[0] + dcRec.img.width / 2;
      s.items.push({ img: dcRec.img, sx: 0, sy: 0, sw: 0, sh: 0, dx: centerX, dy: topY - 14, depth: zone.buildTx + zone.buildTy + 3.01, meta: { label, color: insideCounts[i] ? "#ffe28a" : "#fff8ec" } });
    });

    for (const agent of agents) {
      if (agent.phase === "working") continue;
      const sheet = CHARS[ZONES[agent.zoneIndex].key];
      const anim = agent.moving ? "walk" : "idle";
      const { sx, sy } = charFrame(sheet, anim, agent.dir, agent.moving, agent.animTime);
      s.char(sheet, sx, sy, agent.x, agent.y, false, { label: agent.label });
    }

    return s;
  }

  function drawFogOfWar() {
    const cx = 336, cy = 182;
    const fog = cityCtx.createRadialGradient(cx, cy, 135, cx, cy, 300);
    fog.addColorStop(0, "rgba(6,3,12,0)");
    fog.addColorStop(0.6, "rgba(6,3,12,0.2)");
    fog.addColorStop(1, "rgba(4,2,9,0.9)");
    cityCtx.fillStyle = fog;
    cityCtx.fillRect(0, 0, cityCanvas.width, cityCanvas.height);
  }

  // ---- interior: one small isometric room per zone ----
  const ROOM_MIN = 5; // minimum room footprint (tiles), on both axes
  const INTERIOR_SCALE = 1.35; // zoom so the room fills more of the popup

  // Desk+chair pairing follows the asset pack's own convention: the chair
  // sits one tile behind the desk (smaller ty) facing "SW" (toward the
  // viewer), the desk sits in front facing "NE" (screen toward the chair) -
  // so the seated character reads as facing their monitor, not away from it.
  function deskAndChair(s, images, tx, ty, filter, info) {
    s.obj(images.objects.office_chair_SW, tx, ty, filter);
    s.obj(images.objects.desk_computer_NE, tx, ty + 1, filter, info);
  }

  const ROOMS = {
    lambda: { nx: ROOM_MIN, ny: ROOM_MIN, floor: "concrete", rightWall: "poster_lambda_right", leftWall: "server_left",
      furnish(s, images) {
        // racks against the left wall face SE (out into the room); nothing here sits against the back wall
        s.obj(images.objects.server_rack_SE, 0, 0, hueFilter(0), "Lambda: 3 functions warm · avg 128ms");
        s.obj(images.objects.server_rack_SE, 0, 1, hueFilter(0), "Lambda: 214 invocations/min");
        s.obj(images.objects.server_rack_SE, 0, 2, hueFilter(0), "Lambda: concurrency 12/1000");
        s.obj(images.objects.data_box_SE, 4, 1);
        s.obj(images.objects.plant, 4, 0);
        deskAndChair(s, images, 2, 2, null, "Console: lambda:ListFunctions ✓");
        s.obj(images.objects.coffee_machine_SW, 4, 3);
      },
      seat: { x: 2, y: 2 } },
    dynamodb: { nx: ROOM_MIN, ny: ROOM_MIN, floor: "server_grate", rightWall: "server_right", leftWall: "server_left",
      furnish(s, images) {
        // rack at (1,0) sits against the BACK wall, so it faces SW, not SE like the ones on the left wall
        s.obj(images.objects.server_rack_SE, 0, 0, hueFilter(130), "DynamoDB: 12 tables online");
        s.obj(images.objects.server_rack_SW, 1, 0, hueFilter(130), "DynamoDB: 40 RCU / 25 WCU used");
        s.obj(images.objects.server_rack_SE, 0, 1, hueFilter(130), "DynamoDB: replication healthy");
        s.obj(images.objects.server_rack_SE, 0, 2, hueFilter(130), "DynamoDB: backups current");
        s.obj(images.objects.data_box_SE, 2, 0);
        s.obj(images.objects.plant, 4, 1);
        deskAndChair(s, images, 2, 2, null, "Console: dynamodb:ListTables ✓");
        s.obj(images.objects.data_box_SE, 4, 3);
      },
      seat: { x: 2, y: 2 } },
    cloudwatch: { nx: ROOM_MIN, ny: ROOM_MIN, floor: "carpet_navy", rightWall: "dashboard_right", leftWall: "window_left",
      furnish(s, images) {
        deskAndChair(s, images, 2, 2, null, "Dashboard: cloudwatch:GetMetricData ✓");
        s.obj(images.objects.desk_computer_SE, 0, 1, null, "Alarms: 3 OK · 0 in ALARM");
        s.obj(images.objects.plant, 4, 0);
        s.obj(images.objects.data_box_SE, 4, 3);
      },
      seat: { x: 2, y: 2 } },
  };

  function buildInteriorScene(images, zoneIndex) {
    const zone = ZONES[zoneIndex];
    const room = ROOMS[zone.key];
    const originX = interiorCanvas.width / 2 / INTERIOR_SCALE;
    const originY = 128;
    const s = new SceneBuilder(originX, originY);

    for (let ty = 0; ty < room.ny; ty++) {
      for (let tx = 0; tx < room.nx; tx++) {
        s.floor(images.floors[room.floor], tx, ty);
      }
    }
    const rightRec = images.walls[room.rightWall];
    const rightStep = rightRec.lengthTiles || 1;
    for (let tx = 0; tx < room.nx; tx += rightStep) s.wall(rightRec, tx, 0, hueFilter(zone.hue));

    const leftRec = images.walls[room.leftWall];
    const leftStep = leftRec.lengthTiles || 1;
    for (let ty = 0; ty < room.ny; ty += leftStep) s.wall(leftRec, 0, ty, hueFilter(zone.hue));

    room.furnish(s, images, CHARS[zone.key]);

    const clickables = s.items
      .filter((it) => it.meta && it.meta.clickable)
      .map((it) => ({ x0: it.dx, y0: it.dy, x1: it.dx + it.sw, y1: it.dy + it.sh, info: it.meta.info }));

    const inside = agents.filter((a) => a.phase === "working" && a.zoneIndex === zoneIndex);
    const bubbles = [];
    inside.forEach((agent) => {
      const sheet = CHARS[zone.key];
      const seat = room.seat;
      const { sx, sy } = charFrame(sheet, "sit", "SW", false, agent.animTime);
      s.char(sheet, sx, sy, seat.x, seat.y, true, { label: agent.label, font: "bold 8px sans-serif" });

      const seatV = s.vertex(seat.x, seat.y);
      const seed = agent.label.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const lines = zone.talk;
      const idx = Math.floor((performance.now() / 3800 + seed) % lines.length);
      bubbles.push({ x: seatV.x, y: seatV.y - 74, text: lines[idx] });
    });

    return { scene: s, inside, clickables, bubbles };
  }

  function drawInteriorChrome(zoneIndex, inside) {
    const zone = ZONES[zoneIndex];
    interiorCtx.font = "bold 14px sans-serif";
    interiorCtx.fillStyle = "#fff8ec";
    interiorCtx.textAlign = "left";
    interiorCtx.fillText(zone.name, 16, 26);
    interiorCtx.font = "10px sans-serif";
    interiorCtx.fillStyle = "#b6a7d9";
    interiorCtx.fillText(inside.length ? "Currently working here:" : "Nobody's here right now — an agent will drop by soon.", 16, 40);
    if (inside.length) {
      interiorCtx.font = "10px sans-serif";
      interiorCtx.fillStyle = "#f5efe6";
      inside.forEach((a, i) => {
        interiorCtx.fillText(`${a.label}: ${a.currentAction}`, 16, 54 + i * 13);
      });
    }
  }

  // ---- view state ----
  let view = "city";
  let interiorZoneIndex = 0;
  let interiorClickables = [];
  let infoBubble = null; // { x, y, text, until }
  function openInterior(i) {
    view = "interior"; interiorZoneIndex = i;
    cityCanvas.hidden = true; interiorCanvas.hidden = false;
    backBtn.hidden = false; navLabel.textContent = ZONES[i].name;
    infoBubble = null;
  }
  function closeInterior() {
    view = "city";
    cityCanvas.hidden = false; interiorCanvas.hidden = true;
    backBtn.hidden = true; navLabel.textContent = "Click a building to look inside.";
  }
  backBtn.addEventListener("click", closeInterior);

  let loadedImages = null;
  cityCanvas.addEventListener("click", (e) => {
    if (!loadedImages) return;
    const rect = cityCanvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * cityCanvas.width;
    const py = (e.clientY - rect.top) / rect.height * cityCanvas.height;
    for (let i = 0; i < ZONES.length; i++) {
      const r = buildingRect(ZONES[i], loadedImages);
      if (px >= r.x0 && px <= r.x1 && py >= r.y0 && py <= r.y1) { openInterior(i); return; }
    }
  });

  interiorCanvas.addEventListener("click", (e) => {
    const rect = interiorCanvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * interiorCanvas.width / INTERIOR_SCALE;
    const py = (e.clientY - rect.top) / rect.height * interiorCanvas.height / INTERIOR_SCALE;
    for (const c of interiorClickables) {
      if (px >= c.x0 && px <= c.x1 && py >= c.y0 && py <= c.y1) {
        infoBubble = { x: (c.x0 + c.x1) / 2, y: c.y0, text: c.info, until: performance.now() + 4000 };
        return;
      }
    }
  });

  let last = performance.now();
  function loop(images) {
    loadedImages = images;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      for (const agent of agents) stepAgent(agent, dt, now);

      cityCtx.clearRect(0, 0, cityCanvas.width, cityCanvas.height);
      buildCityScene(images).render(cityCtx);
      drawFogOfWar();

      if (view === "interior") {
        interiorCtx.clearRect(0, 0, interiorCanvas.width, interiorCanvas.height);
        const bgGrad = interiorCtx.createLinearGradient(0, 0, 0, interiorCanvas.height);
        bgGrad.addColorStop(0, "#241a37");
        bgGrad.addColorStop(1, "#180f26");
        interiorCtx.fillStyle = bgGrad;
        interiorCtx.fillRect(0, 0, interiorCanvas.width, interiorCanvas.height);
        const { scene, inside, clickables, bubbles } = buildInteriorScene(images, interiorZoneIndex);
        interiorClickables = clickables;
        interiorCtx.save();
        interiorCtx.scale(INTERIOR_SCALE, INTERIOR_SCALE);
        scene.render(interiorCtx);
        for (const b of bubbles) drawBubble(interiorCtx, b.x, b.y, b.text, 110);
        if (infoBubble && now < infoBubble.until) {
          drawBubble(interiorCtx, infoBubble.x, infoBubble.y, infoBubble.text, 120);
        } else if (infoBubble) {
          infoBubble = null;
        }
        interiorCtx.restore();
        drawInteriorChrome(interiorZoneIndex, inside);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  async function hydrateChars() {
    await Promise.all(Object.entries(CHARS).map(([k, v]) => loadImage(v.data).then((img) => { CHARS[k].img = img; })));
  }

  Promise.all([
    hydrate(CITY.floors), hydrate(CITY.walls), hydrate(CITY.objects), hydrate(CITY.buildings),
    hydrateChars(),
  ])
    .then(([floors, walls, objects, buildings]) => {
      loop({ floors, walls, objects, buildings });
    })
    .catch((err) => {
      cityCtx.fillStyle = "#2d2144";
      cityCtx.fillRect(0, 0, cityCanvas.width, cityCanvas.height);
      cityCtx.fillStyle = "#f5efe6";
      cityCtx.font = "8px sans-serif";
      cityCtx.fillText("Sprites failed to load", 10, 80);
      console.error(err);
    });
})();
</script>
